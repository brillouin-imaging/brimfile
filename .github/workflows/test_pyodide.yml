name: Run Pyodide Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
jobs:
  test-pyodide:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Install JS test dependencies
      working-directory: tests/js
      run: npm install

    - name: Run pyodide tests with pytest
      env:
        PYTHONASYNCIODEBUG: true
      run: |
        pytest tests/test_file_abstraction_pyodide.py -v --import-mode=importlib -m pyodide

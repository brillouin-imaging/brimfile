[build-system]
requires = ["hatchling >= 1.26", "hatch-vcs >= 0.4"]
build-backend = "hatchling.build"
[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
[tool.hatch.build.hooks.vcs]
version-file = "src/brimfile/_version.py"

[project]
name = "brimfile"
dynamic = ["version"]
requires-python = ">=3.11"
authors = [
    {name = "Carlo Bevilacqua", email = "carlo.bevilacqua@embl.de"},
    {name = "Sebastian Hambura", email = "sebastian.hambura@embl.de"},
]
description = "A package to read and write to the brim file format, containing spectral data and metadata from Brillouin microscopy"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Intended Audience :: Developers",
	"Topic :: File Formats",
	"Topic :: Scientific/Engineering",
  "Programming Language :: Python :: 3"
	
]
keywords = ["Brillouin microscopy"]
dependencies = [
  "zarr >= 3.1.1",
  "numpy"
]

[project.optional-dependencies]
remote-store = ["zarr[remote]>=3.1.1", "s3fs"]
export-tiff = ["tifffile"]
converter = ["h5py"]

[project.urls]
Documentation = "https://brillouin-imaging.github.io/brimfile/"
Repository = "https://github.com/brillouin-imaging/brimfile"
Issues = "https://github.com/brillouin-imaging/brimfile/issues"

[tool.pytest.ini_options]
markers = [
    "pyodide: tests that run the pyodide `_zarrFile` implementation inside a real pyodide runtime via Node.js (requires Node/npm and `tests/js/node_modules`, see tests/README.md).",
]

[tool.mypy]
# Run with `mypy` from the repository root
files = ["src/brimfile"]
# check against the oldest supported Python version (see `requires-python`)
python_version = "3.11"
strict = true
warn_unused_configs = true

# Third-party packages that do not ship type information or that are optional
# (not necessarily installed when running mypy).
# N.B. the pyodide-specific code in `file_abstraction.py` is skipped by mypy,
# so `pyodide` and `js` don't need to be listed here.
[[tool.mypy.overrides]]
module = [
    "h5py",
    "numcodecs",
    "fsspec",
    "brimfile._version",  # generated by hatch-vcs at build/install time
]
ignore_missing_imports = true
